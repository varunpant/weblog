baseurl = "https://varunpant.com/"
locale = "en-us"
theme = "hello-friend"
publishDir = "docs"
disqusShortname = "varunpant"

[pagination]
pagerSize = 5

# Posts contain hand-authored <img> and <div> markup (no <script> anywhere).
# With the default unsafe=false, Goldmark silently dropped it and warned on
# every build. All content here is first-party, so passing it through is safe.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[services]
[services.googleAnalytics]
# GA4 property "varuns blog" (stream 15323880732). Hugo's internal template
# emits gtag.js automatically for G- prefixed (GA4) IDs.
id = "G-P8WGKXR03S"

[params]
  # dir name of your blog content (default is `content/posts`)
  contentTypeName = "posts"
  # "light" or "dark"
  defaultTheme = "light"
  # if you set this to 0, only submenu trigger will be visible
  showMenuItems = 5
  # Show reading time in minutes for posts
  showReadingTime = true
  authorName = "Varun Pant"
  authorEmail = "varun@varunpant.com"
 
  
  

[languages]
  [languages.en]
    title = "Varun Pant"
    copyright = ""

    # These are read by the theme as $.Site.Params.*, so they must live under
    # [languages.en.params] — at language level Hugo does not expose them as
    # params and every one of them silently falls back to the theme default
    # (which is why the homepage <title> had no subtitle and the keywords
    # meta tag rendered empty).
    [languages.en.params]
      subtitle = "WebLog"
      keywords = "Cloud,maps,GIS,Google Cloud,Google Maps,Openlayer,Javascript,go,Hadoop,BigData,Spark"
      menuMore = "Show more"
      writtenBy = "Varun Pant"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      newerPosts = "Newer posts"
      olderPosts = "Older posts"
      minuteReadingTime = "min read"
      dateFormatSingle = "2006-01-02"
      dateFormatList = "2006-01-02"

    [languages.en.params.logo]
      logoText = "Varun Pant"
      logoHomeLink = "/"
    # or
    #
    # path = "/img/your-example-logo.svg"
    # alt = "Your example logo alt text"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about"
      [[languages.en.menu.main]]
        identifier = "feed"
        name = "Feed"
        url = "/feed.xml"
      [[languages.en.menu.main]]
        identifier = "archive"
        name = "Archives"
        url = "/archives"
      [[languages.en.menu.main]]
        identifier = "showcase"
        name = "Showcase"
        url = "/showcase"
      [[languages.en.menu.main]]
        identifier = "privacy"
        name = "Privacy"
        url = "/privacy"

[outputFormats]
[outputFormats.RSS]
mediatype = "application/rss"
baseName = "feed"